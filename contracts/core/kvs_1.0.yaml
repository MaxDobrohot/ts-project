GraphSchema:  directed: true  weighted: true  vertex_properties:    - id: UUID    - level: {A, B, C, D, E, F, X}    - status: {UNMARKED, A_RAW, B_FIXED, C_RULED, D_PROJECTED, E_REBUILT, F_BOUNDED, X_META}    - S: float  # semantic novelty    - R: float  # reproducibility    - language_tag: string    - constraint_schema: UUID  # ссылка на C-правило (подграф)  edge_properties:    - source: UUID    - target: UUID    - type: {hb, causal, virtual, meta}    - weight: float    - TS-Clock: τ  transaction_properties:    - atomic: true    - rollback_on_Z_violation: true    - snapshot_isolation: true  gamma_computation:    scope: causal_window  # Γ_Locality    metric: spectral_radius_normalized_laplacian  # или иной аппроксимант    epsilon: adaptive  # инициализируется на C, обновляется Optimizer  clock_protocol:    type: Lamport_semantic    conflict_resolution: max(S) || max(R)  virtual_graph_lifecycle:    creation: on_R2_trigger    destruction: [causal_window_expiry, R3_commit, gamma_below_sigma]    orphan_handling: mark_sweep  X_commit:    conditions: [delta_gamma_X > epsilon_X, C_invariant_validation, optimizer_approval]    direct_G_access: false