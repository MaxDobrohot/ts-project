name: TS-Validator CI + Deploy
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml
      - name: Run pytest suite
        run: python -m pytest tests/test_validator.py -v
      - name: Verify ε ∈ C-rules & ΔΓ > ε (Z_R.5 compliant)
        run: |
          echo "🔍 CI-верификация: проверка инвариантов C-уровня..."
          python3 -c "
          import yaml, json, sys
          with open('validator/config/validator_config.yaml') as f: cfg = yaml.safe_load(f)
          eps = cfg['gamma_computation']['epsilon_friction']['default']
          with open('ts_sandbox_report.json') as f: report = json.load(f)
          delta = round(max(0.0, 1.0 - report.get('avg_friction_on_pass', 0.5)), 4)
          assert delta > eps, f'❌ ΔΓ ({delta:.4f}) ≤ ε ({eps:.3f}). Деплой заблокирован per X_Commit_Lock.'
          print(f'✅ CI-верификация пройдена: ΔΓ={delta:.4f} > ε={eps:.3f}')
          "
      - name: Run MetaCheck
        run: |
          echo "🔍 Запуск Layer 4 (MetaCheck)..."
          python3 validator/ts_layer4_metacheck.py
      - name: Generate dashboard (snapshot)
        run: |
          echo "📊 Генерация дашборда (B-level snapshot)..."
          python3 scripts/visualize_metrics.py --html

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: 'output'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
