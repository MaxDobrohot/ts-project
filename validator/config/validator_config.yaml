# validator_config.yamlversion: "1.2"base_reference: "KVS_1.0 + PR_X3"status: "binding"pipeline:  sequential: true  blocking_on_fail: true  rollback_on_violation: true  snapshot_isolation: truestages:  CoreCheck:    priority: 1    blocking: true    checks:      - id: "A0_preservation"        type: "structural"        verify: "Act_N.0.A_level.event_type == 'act_distinction'"      - id: "A_HP_enforcement"        type: "semantic"        verify: "not Act_N.0.has_external_position"      - id: "Z_rules_completeness"        type: "enumerative"        verify: "Act_N.0.z_rules ? KVS_1.0.z_rules"      - id: "R1R3_pipeline_integrity"        type: "pipeline"        verify: |          exists(Theta_AB) ? exists(Theta_BD_or_CD) ? exists(Theta_EA_prime)          AND TS-Clock_assigned_to_all_transitions  GammaCheck:    priority: 2    blocking: true    checks:      - id: "Gamma_norm_computable"        type: "algorithmic"        verify: "Gamma_norm_algorithm ? O(poly(|V|,|E|))"      - id: "epsilon_initialization"        type: "referential"        strategy: "unified_information_criterion"        fallback:          bayesian: "Bayes_factor > 3 (weak_informative_prior)"          frequentist: "p < 0.05 (Benjamini-Hochberg)"          unified: "AIC_delta < -2 || BIC_delta < 0"        domain_override: true      - id: "locality_enforced"        type: "structural"        verify: "Gamma_scope == 'causal_window'"        constraint: "? computed on intersection(agent.causal_window, engine.causal_window)"        max_intersection_ratio: 1.5        fallback: "truncate to agent.causal_window if exceeded"  LanguageCheck:    priority: 3    blocking: true    checks:      - id: "M4_YAML_mapped"        type: "schema"        verify: "? tag ? Act_N.0.language_tags, ? schema ? YAML_Registry"        bridge_reference: "contracts/bridges/m4_bridge_contract.yaml"      - id: "clock_compatible"        type: "protocol"        verify: "Act_N.0.clock_protocol.base == 'Lamport_semantic'"        extension: "?_phys = ?_base + ?_rel(S,R,V,T)"      - id: "constraint_integrity"        type: "referential"        verify: "Act_N.0.constraint_schema.links ? Act_N.0.subgraph_ids"      - id: "temporal_logic_routing"        type: "dynamic"        supported_logics: ["LTL", "CTL", "CTL*", "QTL", "LTL/CTL"]        branching_semantics: "consistent_histories || path_integral"  MetaCheck:    priority: 4    blocking: false    checks:      - id: "Delta_Gamma_X"        type: "metric"        verify: "Act_N.0.meta.delta_gamma > Act_N.0.meta.epsilon_X"      - id: "X_Commit_Lock"        type: "approval"        verify: "Act_N.0.meta.optimizer_approved AND Act_N.0.meta.C_validated"      - id: "role_binding_co_emergence"        type: "constitutional"        verify: "role_binding_protocol.mechanism == 'co-emergent_constitution'"        trigger: "??_norm > ? on causal_window ? TPN_signal_detected"        constraint: "role_switch ? ?_EA?, not external injection"transaction_properties:  atomic: true  rollback_on_Z_violation: true  snapshot_isolation: true  dirty_correction: falsegamma_computation:  epsilon_friction:    default: 0.375    adaptive: true    source: "C-rules || sandbox_calibration"    adaptation_trigger: "delta_gamma > epsilon AND TS-Optimizer approval"    adaptation_scope: "causal_window only"    rollback_on_fail: "Z_Invariant_Rollback"    domain_specific: true    fallback: "Z_Invariant_Rollback if unset"  scope: "causal_window"  # Γ_Locality_Principle  metric: "spectral_radius_normalized_laplacian"  complexity: "O(poly(|V|, |E|))"registry:  on_valid: "register_with_schema_version"  on_invalid: "generate_rejection_report"  rollback:    type: "functional"    mechanism: "restore_last_valid_snapshot"bridge_integration:  m4_contract: "contracts/bridges/m4_bridge_contract.yaml"  temporonomics_mapping: true  TPN_signal_protocol: "intersection(agent.causal_window, engine.causal_window)"  economic_resolver: "A0_multi_X_Economic_Resolver"